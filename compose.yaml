# Cluster de 3 nós. Escala escolhida por arquivo Compose, sem alterar código.
services:
  no1:
    image: chat-distribuido
    build: .
    command: ["--id", "1", "--catalogo", "/app/nos.docker.json"]
    ports:
      - "8001:8001"
    networks: [chat]
    restart: unless-stopped
  no2:
    image: chat-distribuido
    command: ["--id", "2", "--catalogo", "/app/nos.docker.json"]
    ports:
      - "8002:8002"
    networks: [chat]
    restart: unless-stopped
  no3:
    image: chat-distribuido
    command: ["--id", "3", "--catalogo", "/app/nos.docker.json"]
    ports:
      - "8003:8003"
    networks: [chat]
    restart: unless-stopped
networks:
  chat:
    driver: bridge
