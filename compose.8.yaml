# Cluster de 8 nós. Escala escolhida por arquivo Compose, sem alterar código.
services:
  no1:
    image: chat-distribuido
    build: .
    command: ["--id", "1", "--catalogo", "/app/nos.docker.8.json"]
    ports:
      - "8001:8001"
    networks: [chat]
    restart: unless-stopped
  no2:
    image: chat-distribuido
    command: ["--id", "2", "--catalogo", "/app/nos.docker.8.json"]
    ports:
